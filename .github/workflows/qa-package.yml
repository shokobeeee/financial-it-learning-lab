name: QA Complete Packages

on:
  push:
    branches: ["complete-package-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -e
          node --check assets/js/module-package.js
          node --check assets/js/common.js
          node --check assets/js/cloud-lab-engine.js
          node --check sql/app.js
          node --check jcl/app.js
          node --check financial-war-room/app.js
          for f in cloud/spec.js aws/spec.js gcp/spec.js azure/spec.js; do node --check "$f"; done
          for f in financial-war-room/scenarios-*.js; do node --check "$f"; done
      - name: Package files
        run: |
          set -e
          test -f PACKAGE_STANDARD.md
          test -f assets/css/module-package.css
          test -f assets/js/module-package.js
          for d in linux sql cobol jcl cloud aws gcp azure financial-war-room; do test -f "$d/README.md"; test -f "$d/index.html"; done
          for d in sql cobol jcl cloud aws gcp azure financial-war-room; do grep -q 'module-package.js' "$d/index.html"; done
          grep -q 'module-package.js' linux/index.html
          grep -q 'Complete Package Standard' index.html
          grep -q '8 Complete Packages' index.html
      - name: Curriculum invariants
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const d of ['cloud','aws','gcp','azure']){
            const box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync(`${d}/spec.js`,'utf8'),box);
            const s=box.window.CLOUD_SPEC;if(!s||s.topics.length!==20)throw new Error(`${d}: topics=${s?.topics?.length}`);
            if(!s.prefix)throw new Error(`${d}: no prefix`);
          }
          for(const d of ['sql','jcl']){
            const box={LABS:[]};vm.createContext(box);
            for(let i=1;i<=4;i++)vm.runInContext(fs.readFileSync(`${d}/labs-${i}.js`,'utf8'),box);
            if(box.LABS.length!==20)throw new Error(`${d}: labs=${box.LABS.length}`);
          }
          {const box={LABS:[]};vm.createContext(box);for(let i=1;i<=4;i++)vm.runInContext(fs.readFileSync(`cobol/labs-${i}.js`,'utf8'),box);if(box.LABS.length!==20)throw new Error(`cobol: labs=${box.LABS.length}`)}
          const w={window:{WARROOM_SCENARIOS:[]}};vm.createContext(w);vm.runInContext(fs.readFileSync('financial-war-room/scenarios-1.js','utf8'),w);vm.runInContext(fs.readFileSync('financial-war-room/scenarios-2.js','utf8'),w);if(w.window.WARROOM_SCENARIOS.length!==12)throw new Error('warroom cases != 12');
          const pkg=fs.readFileSync('assets/js/module-package.js','utf8');for(const id of ['linux','sql','cobol','jcl','cloud','aws','gcp','azure','financial-war-room'])if(!pkg.includes(id+':')&&!pkg.includes("'"+id+"':"))throw new Error(`package metadata missing ${id}`);
          console.log('Package metadata and curriculum counts OK');
          NODE
      - name: Linux portal invariants
        run: |
          node <<'NODE'
          const s=require('fs').readFileSync('linux/index.html','utf8');
          const links=[...s.matchAll(/parrot_linux_lab\d{2}[^'\"]*\.html/g)].map(x=>x[0]);
          const unique=new Set(links);
          if(unique.size!==20)throw new Error(`Linux unique labs=${unique.size}`);
          if(!s.includes('Learning Step 0'))throw new Error('Linux Step0 missing');
          console.log('Linux portal 20 Labs + Step0 OK');
          NODE
