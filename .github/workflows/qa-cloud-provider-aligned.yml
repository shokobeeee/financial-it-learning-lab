name: QA Cloud Provider Alignment
on:
  push:
    branches: ["cloud-provider-aligned-v2"]
    paths:
      - "assets/js/cloud-provider-aligned.js"
      - "assets/js/cloud-provider-guide.js"
      - "aws/**"
      - "gcp/**"
      - "azure/**"
      - ".github/workflows/qa-cloud-provider-aligned.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "assets/js/cloud-provider-aligned.js"
      - "assets/js/cloud-provider-guide.js"
      - "aws/**"
      - "gcp/**"
      - "azure/**"
      - ".github/workflows/qa-cloud-provider-aligned.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/js/cloud-provider-aligned.js
          node --check assets/js/cloud-provider-guide.js
          node --check cloud/zero-base.js
          node --check cloud/zero-base-ui.js
          for f in aws/spec.js gcp/spec.js azure/spec.js; do node --check "$f"; done
      - name: Cloud Fundamentals remains zero-base
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const box={window:{}};vm.createContext(box);
          vm.runInContext(fs.readFileSync('cloud/spec.js','utf8'),box);
          vm.runInContext(fs.readFileSync('cloud/zero-base.js','utf8'),box);
          const s=box.window.CLOUD_SPEC;
          if(s.stage.title!=='クラウドって、そもそも何？')throw new Error(s.stage.title);
          if(s.topics.length!==20||s.maps.length!==20)throw new Error('Cloud 20 labs/maps missing');
          const checks=[[1,/Webサービス/],[2,/アプリ/],[3,/データ/],[4,/ネットワーク/],[12,/誰が何を操作/],[15,/データを戻/],[17,/銀行の社内/],[20,/War Room/]];
          for(const [n,re] of checks)if(!re.test(s.topics[n-1][1]))throw new Error(`Cloud Lab${n}: ${s.topics[n-1][1]}`);
          NODE
      - name: Provider labs align by concept
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),adapter=fs.readFileSync('assets/js/cloud-provider-aligned.js','utf8');
          const checks=[[1,/Webサービス/],[2,/アプリ/],[3,/データ/],[4,/ネットワーク/],[5,/公開/],[6,/外へ/],[7,/入口/],[8,/通信/],[9,/1台/],[10,/置き場所/],[11,/DB運用/],[12,/誰が何を操作/],[13,/パスワード/],[14,/壊れたこと/],[15,/データを戻/],[16,/大きな障害/],[17,/銀行の社内/],[18,/共通概念/],[19,/変更/],[20,/War Room/]];
          for(const d of ['aws','gcp','azure']){
            const box={window:{}};vm.createContext(box);
            vm.runInContext(fs.readFileSync(`${d}/spec.js`,'utf8'),box);
            vm.runInContext(adapter,box);
            const s=box.window.CLOUD_SPEC;
            if(s.topics.length!==20||s.maps.length!==20)throw new Error(`${d}: expected 20`);
            if(!Array.isArray(s.providerExtras)||s.providerExtras.length<3)throw new Error(`${d}: extras missing`);
            for(const [n,re] of checks)if(!re.test(s.topics[n-1][1]))throw new Error(`${d} Lab${n}: ${s.topics[n-1][1]}`);
            console.log(d, s.topics.map((x,i)=>`${i+1}:${x[1]}`).join(' | '));
          }
          NODE
      - name: Page wiring
        run: |
          set -e
          for d in aws gcp azure; do
            grep -q '../cloud/zero-base.css?v=1' "$d/index.html"
            grep -q 'cloud-provider-aligned.js?v=1' "$d/index.html"
            grep -q '../cloud/zero-base-ui.js?v=1' "$d/index.html"
            grep -q 'cloud-provider-guide.js?v=1' "$d/index.html"
            python - "$d/index.html" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read()
          assert s.index('spec.js') < s.index('cloud-provider-aligned.js') < s.index('cloud-lab-engine.js') < s.index('zero-base-ui.js')
          assert s.index('module-package.js') < s.index('cloud-provider-guide.js')
          PY
          done
      - name: Documentation alignment
        run: |
          grep -q '同じLab番号' aws/README.md
          grep -q '同じLab番号' gcp/README.md
          grep -q '同じLab番号' azure/README.md
          grep -q 'Provider Extras' aws/README.md
          grep -q 'Provider Extras' gcp/README.md
          grep -q 'Provider Extras' azure/README.md
