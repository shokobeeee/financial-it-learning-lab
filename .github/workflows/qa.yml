name: Repository Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Repository invariants
        run: python3 scripts/qa_repository.py

      - name: War Room investigation invariants
        run: python3 scripts/qa_warroom_beginner.py

      - name: Field Incident Gate invariants
        run: python3 scripts/qa_field_casebook.py

      - name: Provider input stays concept-first
        shell: bash
        run: |
          set -euo pipefail
          file='assets/js/cloud-provider-aligned.js'
          grep -Fq "t[4]=[...originalScope.filter(x=>x!==name),name];" "$file"
          grep -Fq "t[4]=['failure domain','redundancy',name,fleet];" "$file"
          if grep -Fq "t[4]=[name,...originalScope" "$file"; then
            echo 'Provider product name was reintroduced as a leading input-mode must token.' >&2
            exit 1
          fi

      - name: Cloud beginner UX review guards
        shell: bash
        run: |
          set -euo pipefail
          file='cloud/visual-engine.js'
          grep -Fq 'vlProviderDetails' "$file"
          grep -Fq 'function axisCompanion(lab)' "$file"
          grep -Fq 'Availability Zone / Zone = 「どこまで一緒に壊れるか」' "$file"
          grep -Fq "done=isDone(lab.id)" "$file"
          grep -Fq "const meta=LEARNING_META[lab.id-1],ops=OPS_META[lab.id],choices=choiceOrder(lab),done=isDone(lab.id);" "$file"
