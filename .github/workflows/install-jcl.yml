name: Install JCL Module

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/install-jcl.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  install:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JCL 20 Labs
        env:
          BUNDLE_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BUNDLE_B64" | base64 -d > /tmp/jcl-bundle.tar.xz
          tar -xJf /tmp/jcl-bundle.tar.xz -C .
          rm -f .github/workflows/install-jcl.yml
          node --check jcl/app.js
          for f in jcl/labs-*.js; do node --check "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jcl index.html assets/js/common.js README.md .github/workflows/install-jcl.yml
          git commit -m "Add JCL Batch Operations Labs 01-20"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload final static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy final static site
        id: deployment
        uses: actions/deploy-pages@v4
