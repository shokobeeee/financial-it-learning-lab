name: QA Home UX v3

on:
  push:
    branches: ["home-ux-v3"]
    paths:
      - "index.html"
      - "assets/css/home-v3.css"
      - "assets/js/home-v3.js"
      - ".github/workflows/qa-home-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check assets/js/home-v3.js
      - name: Home structure
        run: |
          set -e
          grep -q 'data-next-title' index.html
          grep -q 'data-next-link' index.html
          grep -q '学習ルート' index.html
          grep -q '教材を選ぶ' index.html
          grep -q '<details class="moreBox">' index.html
          grep -q 'home-v3.css?v=3' index.html
          grep -q 'home-v3.js?v=3' index.html
          test "$(grep -o 'data-module-card="[a-z-]*"' index.html | sort -u | wc -l)" -eq 9
      - name: Learning path logic
        run: |
          set -e
          for token in linux_lab sql_db_lab cobol_lab jcl_batch_lab cloud_lab aws_lab gcp_lab azure_lab; do grep -q "$token" assets/js/home-v3.js; done
          grep -q 'financial_warroom_' assets/js/home-v3.js
          grep -q "#lab" assets/js/home-v3.js
          grep -q "#case" assets/js/home-v3.js
          grep -q 'totalDone/160' assets/js/home-v3.js
      - name: Mobile UX invariants
        run: |
          set -e
          grep -q '@media(max-width:820px)' assets/css/home-v3.css
          grep -q '@media(max-width:420px)' assets/css/home-v3.css
          grep -q '.compactGrid' assets/css/home-v3.css
          grep -q '.resumeCard' assets/css/home-v3.css
          grep -q '.routeStep.is-current' assets/css/home-v3.css
