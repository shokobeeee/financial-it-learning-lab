name: Sync Linux v16

on:
  push:
    branches: ["v16-context-integration"]
    paths: [".github/workflows/sync-linux-v16.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import published Linux v16
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shokobeeee.github.io/linux-kiban-lab"
          cp linux/README.md /tmp/linux-package-readme.md
          cp linux/integration-bridge.js /tmp/integration-bridge.js
          rm -rf linux
          mkdir -p linux
          files=(
            README.txt README_MOBILE.txt icon-192.png icon-512.png index.html manifest.webmanifest sw.js qa_review_report.html
            parrot_linux_lab01_web_nginx.html parrot_linux_lab02_firewall_complete.html parrot_linux_lab03_ip_dns.html
            parrot_linux_lab04_ssh.html parrot_linux_lab05_permissions.html parrot_linux_lab06_process_memory.html
            parrot_linux_lab07_storage_mount.html parrot_linux_lab08_logs_troubleshooting.html parrot_linux_lab09_apt_packages.html
            parrot_linux_lab10_boot_kernel.html parrot_linux_lab11_bash_pipes.html parrot_linux_lab12_scheduler.html
            parrot_linux_lab13_backup_restore.html parrot_linux_lab14_containers.html parrot_linux_lab15_tls_https.html
            parrot_linux_lab16_monitoring.html parrot_linux_lab17_ansible_iac.html parrot_linux_lab18_virtualization_cloud.html
            parrot_linux_lab19_security_hardening.html parrot_linux_lab20_capstone.html
            ui-compact.css ui-live-terminal.css ui-learning.css ui-learning.js ui-generic.css ui-generic.js ui-density.js
            ui-incident-modes.css ui-incident-modes.js ui-incident-polish.css ui-incident-polish.js
            ui-distro.css ui-distro.js ui-scope-context.css ui-scope-context.js
          )
          for file in "${files[@]}"; do
            echo "GET $file"
            curl --fail --silent --show-error --location --retry 3 "$BASE/$file" -o "linux/$file"
          done
          cp /tmp/linux-package-readme.md linux/README.md
          cp /tmp/integration-bridge.js linux/integration-bridge.js
          python - <<'PY'
          from pathlib import Path
          targets=[Path('linux/index.html'), *sorted(Path('linux').glob('parrot_linux_lab*.html'))]
          tag='  <script src="./integration-bridge.js?v=1"></script>\n'
          for p in targets:
              text=p.read_text(encoding='utf-8')
              if 'integration-bridge.js' not in text:
                  text=text.replace('</body>',tag+'</body>',1)
                  p.write_text(text,encoding='utf-8')
          sw=Path('linux/sw.js')
          text=sw.read_text(encoding='utf-8')
          marker='const ASSETS = ['
          if marker in text and 'integration-bridge.js' not in text:
              text=text.replace(marker,marker+'\n  "./integration-bridge.js?v=1",',1)
              sw.write_text(text,encoding='utf-8')
          PY
          grep -q 'Linux基盤ラボ' linux/index.html
          grep -q 'Debian / RHEL と systemd は別レイヤー' linux/ui-scope-context.js
          grep -q 'Linuxの分類は「同じ軸」ではない' linux/ui-scope-context.js
          grep -q 'integration-bridge.js?v=1' linux/parrot_linux_lab20_capstone.html
          node --check linux/ui-distro.js
          node --check linux/ui-scope-context.js
          node --check linux/ui-incident-polish.js
          node --check linux/integration-bridge.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux
          git commit -m "Sync Linux Labs to v16 with integration bridge" || exit 0
          git push
