name: Import Linux Labs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download published Linux Lab files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shokobeeee.github.io/linux-kiban-lab"
          rm -rf linux
          mkdir -p linux

          files=(
            README.txt
            README_MOBILE.txt
            icon-192.png
            icon-512.png
            index.html
            manifest.webmanifest
            parrot_linux_lab01_web_nginx.html
            parrot_linux_lab02_firewall_complete.html
            parrot_linux_lab03_ip_dns.html
            parrot_linux_lab04_ssh.html
            parrot_linux_lab05_permissions.html
            parrot_linux_lab06_process_memory.html
            parrot_linux_lab07_storage_mount.html
            parrot_linux_lab08_logs_troubleshooting.html
            parrot_linux_lab09_apt_packages.html
            parrot_linux_lab10_boot_kernel.html
            parrot_linux_lab11_bash_pipes.html
            parrot_linux_lab12_scheduler.html
            parrot_linux_lab13_backup_restore.html
            parrot_linux_lab14_containers.html
            parrot_linux_lab15_tls_https.html
            parrot_linux_lab16_monitoring.html
            parrot_linux_lab17_ansible_iac.html
            parrot_linux_lab18_virtualization_cloud.html
            parrot_linux_lab19_security_hardening.html
            parrot_linux_lab20_capstone.html
            qa_review_report.html
            sw.js
            ui-compact.css
            ui-density.js
            ui-generic.css
            ui-generic.js
            ui-incident-modes.css
            ui-incident-modes.js
            ui-learning.css
            ui-learning.js
            ui-live-terminal.css
          )

          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --silent --show-error --location --retry 3 \
              "${BASE}/${file}" -o "linux/${file}"
          done

          test -f linux/index.html
          test -f linux/parrot_linux_lab20_capstone.html
          test -f linux/ui-learning.js
          test -f linux/icon-512.png

      - name: Commit imported Linux Labs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux
          if git diff --cached --quiet; then
            echo "No Linux Lab changes to commit."
            exit 0
          fi
          git commit -m "Import Linux Labs 01-20 into unified learning site"
          git push
